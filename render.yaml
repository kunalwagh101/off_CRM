services:
  - type: web
    name: off-crm-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: OFF_CRM_WEB_HOST
        value: 0.0.0.0
      - key: OFF_CRM_DATA_DIR
        value: /tmp/off_crm/local_data
      - key: OFF_CRM_DB
        value: /tmp/off_crm/local_data/off_crm.db
      - key: OFF_CRM_DEMO_USERNAME
        sync: false
      - key: OFF_CRM_DEMO_PASSWORD
        sync: false
      - key: OFF_CRM_SESSION_SECRET
        generateValue: true
      - key: OFF_CRM_SESSION_HOURS
        value: 8
