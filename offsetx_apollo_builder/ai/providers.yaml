# off_CRM AI provider registry
# ---------------------------------------------------------------------------
# Adding, removing or re-tiering a provider is a change to THIS FILE.
# It must never require a code change.  The application reads this at startup
# and on demand; nothing about a provider is hardcoded in Python or TypeScript.
#
# Every entry needs:
#   jurisdiction     ISO-3166 alpha-2, or XX for routers whose processor is unknown
#   trains_on_input  true if the terms let the provider train on what you send
#   retention        short human sentence, shown in the UI
#   trust_tier       omit to derive from jurisdiction + trains_on_input
#   verified_on      the date a human last read the provider's own policy page
#
# WARNING about verified_on: rate limits and data terms in public "free LLM API"
# lists go stale fast.  The dates below mark when each entry was seeded from
# vendor documentation.  Re-check in the provider's own console before trusting
# a limit for billing or compliance purposes.
#
# Owner trust ordering (2026-07-25): Europe highest, USA default, China below
# default, aggregators nothing.

version: 1
defaults:
  timeout_seconds: 60
  # A provider absent from this file is untrusted and gets nothing (§5.4 D).
  unlisted_provider_tier: D

# ── Model origin rules ─────────────────────────────────────────────────────
# A host like NVIDIA NIM serves 100+ models built by other companies. The host's
# jurisdiction says nothing about who *made* the model, and where pass-through to
# the model's developer is undocumented the model cannot inherit the host's
# trust (§5.4 provenance caveat).
#
# These rules classify a model by the prefix of its id. They apply to models
# discovered live from a provider's /models endpoint as well as to models listed
# below. THE PROVIDER TELLS US NAMES; THIS FILE DECIDES WHAT THEY ARE TRUSTED
# WITH.
#
# A model matching no rule is `unknown` — tier D, receives nothing — until you
# add a rule for it. Unknown is never treated as safe.
model_origin_rules:
  # Chinese-developed open-weight models. Capped at C wherever they are hosted.
  - prefix: "deepseek-ai/"
    origin: CN
    tier_cap: C
  - prefix: "deepseek/"
    origin: CN
    tier_cap: C
  - prefix: "qwen/"
    origin: CN
    tier_cap: C
  - prefix: "alibaba/"
    origin: CN
    tier_cap: C
  - prefix: "moonshotai/"
    origin: CN
    tier_cap: C
  - prefix: "moonshot/"
    origin: CN
    tier_cap: C
  - prefix: "zhipuai/"
    origin: CN
    tier_cap: C
  - prefix: "thudm/"
    origin: CN
    tier_cap: C
  - prefix: "01-ai/"
    origin: CN
    tier_cap: C
  - prefix: "baichuan"
    origin: CN
    tier_cap: C
  - prefix: "yi-"
    origin: CN
    tier_cap: C

  # European developers — no cap needed, they do not lower a host's tier.
  - prefix: "mistralai/"
    origin: EU
  - prefix: "mistral-"
    origin: EU

  # US developers.
  - prefix: "meta/"
    origin: US
  - prefix: "meta-llama/"
    origin: US
  - prefix: "llama-"
    origin: US
  - prefix: "microsoft/"
    origin: US
  - prefix: "nvidia/"
    origin: US
  - prefix: "google/"
    origin: US
  - prefix: "gemma-"
    origin: US
  - prefix: "ibm/"
    origin: US
  - prefix: "ibm-granite/"
    origin: US
  - prefix: "openai/"
    origin: US
  - prefix: "gpt-"
    origin: US
  - prefix: "claude-"
    origin: US
  - prefix: "nemotron"
    origin: US
  - prefix: "phi-"
    origin: US

providers:

  # ── Europe — highest trust (tier A) ──────────────────────────────────────
  - id: mistral
    name: Mistral AI
    jurisdiction: FR
    flag: "🇫🇷"
    adapter: openai_compatible
    base_url: https://api.mistral.ai/v1
    default_model: mistral-large-latest
    supports_model_discovery: true
    models:
      - id: mistral-large-latest
        context_window: 128000
        cost_per_1m_input_usd: 2.00
        cost_per_1m_output_usd: 6.00
        good_at: [writing, reasoning, multilingual]
      - id: mistral-small-latest
        context_window: 128000
        cost_per_1m_input_usd: 0.20
        cost_per_1m_output_usd: 0.60
        good_at: [writing, classification, bulk]
    free_tier:
      requests_per_minute: 60
      requests_per_day: 1000000
      notes: Roughly 1 request/second on the free experiment plan.
    trains_on_input: false
    retention: EU-hosted. Does not train on API inputs. GDPR data-processing terms.
    key_url: https://console.mistral.ai/api-keys
    key_placeholder: "…"
    how_to_get: >-
      Sign up at console.mistral.ai, open API keys, create one. European company
      under GDPR, which is why it sits in the highest trust tier here.
    verified_on: 2026-07-25

  # ── United States — default trust (tier B) ───────────────────────────────
  - id: openai
    name: OpenAI
    jurisdiction: US
    flag: "🇺🇸"
    adapter: openai
    base_url: https://api.openai.com/v1
    default_model: gpt-4o
    supports_model_discovery: true
    models:
      - id: gpt-4o
        context_window: 128000
        cost_per_1m_input_usd: 2.50
        cost_per_1m_output_usd: 10.00
        good_at: [writing, reasoning, orchestration, code]
      - id: gpt-4o-mini
        context_window: 128000
        cost_per_1m_input_usd: 0.15
        cost_per_1m_output_usd: 0.60
        good_at: [writing, classification, bulk]
    trains_on_input: false
    retention: API inputs are not used for training by default. 30-day abuse retention.
    key_url: https://platform.openai.com/api-keys
    key_placeholder: sk-…
    how_to_get: >-
      platform.openai.com, API keys, create new secret key. This is separate
      from a ChatGPT Plus subscription — the API bills per token from its own
      credit balance. A small top-up covers thousands of emails.
    verified_on: 2026-07-25

