services:
  - type: web
    name: off-crm
    runtime: docker
    # Production customer state cannot run on Render's ephemeral free web tier.
    # This service is deliberately single-instance because the current complete
    # local workspace uses SQLite plus filesystem assets on one persistent disk.
    plan: 0.5c-512mb
    numInstances: 1
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    disk:
      name: off-crm-data
      mountPath: /var/lib/offcrm
      sizeGB: 10
    envVars:
      - key: OFFSETX_PRODUCTION
        value: "1"
      - key: OFFSETX_WEB_HOST
        value: 0.0.0.0
      - key: OFFSETX_DATA_DIR
        value: /var/lib/offcrm/local_data
      - key: OFFSETX_OUTREACH_DB
        value: /var/lib/offcrm/local_data/offsetx_outreach.db
      - key: OFFSETX_BACKUP_MAX_BYTES
        value: "536870912"
      - key: OFFSETX_DEMO_USERNAME
        sync: false
      - key: OFFSETX_DEMO_PASSWORD
        sync: false
      - key: OFFSETX_SESSION_SECRET
        generateValue: true
      - key: OFFSETX_SESSION_HOURS
        value: 8
