name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --extra dev --extra email --locked
      - name: Catch broken Python names and syntax
        run: uv run ruff check --select E9,F63,F7,F82 .
      - name: Smoke-test installed command-line entry points
        run: |
          uv run offsetx-apollo --help
          uv run offsetx-outreach --help
          uv run offsetx-web --help
          uv run offsetx-evals --help
          uv run offsetx-tools --help
          uv run offsetx-notebook --help
          uv run offsetx-db --help
          uv run offsetx-codegraph --help
          uv run offsetx-email-worker --help
      - name: Run Vault acceptance evidence
        run: uv run pytest tests/test_browser_vault.py tests/test_browser_vault_wiring.py -q
      - name: Run Revoke and Forget acceptance evidence
        run: uv run pytest tests/test_browser_revoke.py -q
      - name: Run bounded Run Loop acceptance evidence
        run: uv run pytest tests/test_agent_run.py -q
      - name: Run Python tests
        run: uv run pytest -q
      # The board verifier is standard-library-only, but the evidence commands
      # it re-runs are not: they invoke `python -m pytest`. Running the verifier
      # through uv keeps those child processes inside the same locked environment
      # that was just tested instead of accidentally resolving the runner's bare
      # system Python.
      - name: Verify the board against the repository
        run: uv run python scripts/verify_board.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build