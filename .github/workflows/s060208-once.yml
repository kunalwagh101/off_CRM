name: s060208-one-runner-once

on:
  push:
    paths:
      - .github/workflows/s060208-once.yml

permissions:
  contents: write

jobs:
  deliver:
    if: github.event.head_commit.message == 'Run S-06.02.08 delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure delivery identity
        run: |
          git config user.name "off-CRM delivery bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Pull S-06.02.08 and record defects already exposed
        run: |
          uv run python scripts/s060208_once.py pull
          git add BOARD.md PRODUCT_BACKLOG.md DEFECT_LOG.md
          git commit -m "Pull S-06.02.08 and log discovered process defects"
          git push origin HEAD:main
      - name: Install locked evidence environments
        run: |
          uv sync --extra dev --extra email --locked
          npm ci --prefix frontend
      - name: Report current frontend dependency audit
        run: |
          echo "Production dependency audit:"
          npm audit --prefix frontend --omit=dev || true
          echo "Full dependency audit:"
          npm audit --prefix frontend || true
      - name: Implement canonical evidence runner contract
        run: uv run python scripts/s060208_once.py implement
      - name: Static validation
        run: uv run ruff check --select E9,F63,F7,F82 scripts/verify_board.py tests/test_verify_board.py tests/test_ci_verifier_environment.py
      - name: Run focused acceptance evidence
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/test_verify_board.py tests/test_ci_verifier_environment.py -q | tee /tmp/s060208-focused.txt
          summary="$(tail -n 1 /tmp/s060208-focused.txt)"
          echo "FOCUSED_SUMMARY=$summary" >> "$GITHUB_ENV"
      - name: Run full Python regression
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q | tee /tmp/s060208-full.txt
          summary="$(tail -n 1 /tmp/s060208-full.txt)"
          echo "FULL_SUMMARY=$summary" >> "$GITHUB_ENV"
      - name: Commit implementation before certification
        run: |
          git add BOARD.md scripts/verify_board.py tests/test_verify_board.py tests/test_ci_verifier_environment.py DEFINITION_OF_DONE.md README.md CONTINUE.md .github/workflows/ci.yml
          git commit -m "Implement S-06.02.08 canonical evidence runner"
          git push origin HEAD:main
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Close governance artifacts
        run: |
          uv run python scripts/s060208_once.py close "$IMPLEMENTATION_SHA" "$FOCUSED_SUMMARY" "$FULL_SUMMARY"
      - name: Independent repository verifier
        run: uv run python scripts/verify_board.py
      - name: Remove one-shot delivery transport
        run: rm scripts/s060208_once.py .github/workflows/s060208-once.yml
      - name: Commit certified delivery
        run: |
          git add -A
          git commit -m "Certify S-06.02.08 delivery artifacts"
          git push origin HEAD:main
