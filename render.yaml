services:
  - type: web
    name: off-crm-demo
    runtime: docker
    plan: free
    region: singapore
    # TEMPORARY: deploying the AI-module branch so it can be tested on a real
    # server before it reaches main. Switch this back to `main` once the work
    # is merged — tests/test_ai_registry_packaging.py enforces that a
    # non-main branch must carry this note, so the temporary state cannot be
    # forgotten silently.
    branch: claude/ai-module-hardening
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: OFFSETX_WEB_HOST
        value: 0.0.0.0
      - key: OFFSETX_DATA_DIR
        value: /tmp/offsetx/local_data
      - key: OFFSETX_OUTREACH_DB
        value: /tmp/offsetx/local_data/offsetx_outreach.db
      - key: OFFSETX_DEMO_USERNAME
        sync: false
      - key: OFFSETX_DEMO_PASSWORD
        sync: false
      - key: OFFSETX_SESSION_SECRET
        generateValue: true
      - key: OFFSETX_SESSION_HOURS
        value: 8
