  - id: nvidia
    name: NVIDIA NIM
    jurisdiction: US
    flag: "🇺🇸"
    adapter: openai_compatible
    base_url: https://integrate.api.nvidia.com/v1
    default_model: meta/llama-3.1-70b-instruct
    # One NVIDIA key reaches 100+ models. This is a useful starting set; press
    # "Find models" in Connectors to pull the live catalogue. Origin and tier cap
    # come from model_origin_rules above, so a Chinese-built model hosted here
    # stays tier C no matter that NVIDIA itself is tier B.
    supports_model_discovery: true
    models:
      # ── Built in the US — inherit NVIDIA's tier B ──────────────────────────
      - id: meta/llama-3.1-70b-instruct
        context_window: 128000
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [writing, reasoning, code]
        model_origin: US
      - id: meta/llama-3.3-70b-instruct
        context_window: 128000
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [writing, reasoning, bulk]
        model_origin: US
      - id: nvidia/llama-3.1-nemotron-70b-instruct
        context_window: 128000
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [writing, reasoning, planning]
        model_origin: US
      # A reasoning model: it "thinks" before answering, and that thinking eats
      # tokens. Without an explicit max_tokens the provider's own default can cut
      # the answer off before it starts. request_options is sent with every call
      # to this model — the same fields you would pass to the OpenAI SDK.
      - id: nvidia/nemotron-3-ultra-550b-a55b
        context_window: 128000
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [reasoning, architecture, planning, code]
        model_origin: US
        request_options:
          max_tokens: 16384
          temperature: 1
          top_p: 0.95
          chat_template_kwargs:
            enable_thinking: true
          reasoning_budget: 16384
      - id: microsoft/phi-3-medium-128k-instruct
        context_window: 128000
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [classification, bulk, code]
        model_origin: US
      - id: google/gemma-2-27b-it
        context_window: 8192
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [writing, classification]
        model_origin: US
      - id: ibm/granite-3.0-8b-instruct
        context_window: 4096
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [classification, bulk]
        model_origin: US

      # ── Built in the EU ───────────────────────────────────────────────────
      - id: mistralai/mistral-large-2-instruct
        context_window: 128000
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [writing, reasoning, multilingual]
        model_origin: EU

      # ── Built in China — capped at tier C even though the host is tier B ──
      # Provenance caveat (§5.4): NVIDIA does not document whether inputs pass
      # through to the model's original developer, so these cannot hold more
      # than a tier C provider would.
      - id: deepseek-ai/deepseek-r1
        context_window: 128000
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [reasoning, architecture, code, planning]
        model_origin: CN
        model_origin_tier_cap: C
        request_options:
          max_tokens: 8192
      - id: qwen/qwen2.5-coder-32b-instruct
        context_window: 32000
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [code]
        model_origin: CN
        model_origin_tier_cap: C
      - id: qwen/qwen2.5-7b-instruct
        context_window: 32000
        cost_per_1m_input_usd: 0.0
        cost_per_1m_output_usd: 0.0
        good_at: [bulk, multilingual]
        model_origin: CN
        model_origin_tier_cap: C
    free_tier:
      requests_per_minute: 40
      notes: Phone verification required.
    trains_on_input: false
    retention: States it does not train on inputs. Hosts many third-party models.
    key_url: https://build.nvidia.com
    key_placeholder: nvapi-…
    how_to_get: >-
      build.nvidia.com, sign in, get API key. Runs open-weight models on NVIDIA
      hardware, useful when you want that quality without a local GPU.
    verified_on: 2026-07-25

