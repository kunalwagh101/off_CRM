name: certify-s060203-once

on:
  push:
    branches: [main]
    paths:
      - scripts/certify_s060203.py
      - .github/workflows/certify-s060203.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --extra dev --extra email --locked
      - name: Install frontend evidence dependencies
        working-directory: frontend
        run: npm ci
      - name: Apply governance artifacts
        run: uv run python scripts/certify_s060203.py
      - name: Run feature evidence
        run: uv run pytest tests/test_agent_run_budgets.py tests/test_agent_money_ceiling.py -q
      - name: Run CI-verifier regression evidence
        run: uv run pytest tests/test_ci_verifier_environment.py tests/test_verify_board.py -q
      - name: Run independent board verifier
        run: uv run python scripts/verify_board.py
      - name: Remove one-shot certification transport
        run: rm scripts/certify_s060203.py .github/workflows/certify-s060203.yml
      - name: Commit certified artifacts
        run: |
          git config user.name "off-CRM delivery bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Certify S-06.02.03 delivery artifacts"
          git push origin HEAD:main
