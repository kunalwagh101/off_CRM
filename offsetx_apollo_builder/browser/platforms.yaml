platforms:
- id: linkedin
  label: LinkedIn
  login_url: https://www.linkedin.com/login
  home_url: https://www.linkedin.com/feed/
  signed_in:
  - my network
  - messaging
  - start a post
  - my items
  signed_out:
  - sign in
  - join now
  - new to linkedin
  note: "Attended only. The agent may read as you when you ask it to and never on\
    \ a schedule \u2014 see `policy.py`. Automated collection breaches the User Agreement\
    \ and the penalty falls on your account."
  domains:
  - linkedin.com
  min_seconds_between_actions: 6.0
  unattended: false
  refuse:
  - bulk_export
  confirm:
  - send
  - submit
  - connect
  actions_per_hour: 30
  actions_per_day: 120
- id: instagram
  label: Instagram
  login_url: https://www.instagram.com/accounts/login/
  home_url: https://www.instagram.com/
  signed_in:
  - home
  - new post
  - profile
  - direct
  signed_out:
  - log in
  - sign up
  - forgot password
  note: The Business Discovery API is the supported route for competitor data.
  domains:
  - instagram.com
  min_seconds_between_actions: 5.0
  unattended: false
  refuse: []
  confirm:
  - send
  - submit
  - publish
  actions_per_hour: 25
  actions_per_day: 100
