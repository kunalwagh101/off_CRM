        context_window: 128000
        good_at: [writing]
    is_aggregator: true
    trains_on_input: true
    retention: >-
      Routes to third-party providers whose terms vary per model and change
      without notice. The processor for any given call is not knowable up front.
    key_url: https://openrouter.ai/keys
    key_placeholder: sk-or-…
    how_to_get: >-
      Available, but off_CRM will not send anything through an aggregator by
      default. Raise the tier explicitly if you accept the exposure.
    verified_on: 2026-07-25

