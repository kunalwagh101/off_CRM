name: s060202-api-boundaries-once

on:
  push:
    branches:
      - feature/s-06-02-02-api-boundaries
    paths:
      - .github/workflows/s060202-once.yml

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/s-06-02-02-api-boundaries
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure delivery identity
        run: |
          git config user.name "off-CRM delivery bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Syntax-check delivery helper
        run: uv run python -m py_compile scripts/s060202_once.py
      - name: Pull story and refine inspectable backlog
        run: |
          uv run python scripts/s060202_once.py pull
          git add BOARD.md PRODUCT_BACKLOG.md TRACEABILITY.md DEFECT_LOG.md
          git commit -m "Pull and refine S-06.02.02"
          git push origin HEAD:feature/s-06-02-02-api-boundaries
      - name: Install locked environments
        run: |
          uv sync --extra dev --extra email --locked
          npm ci --prefix frontend
      - name: Implement API boundary hardening
        run: uv run python scripts/s060202_once.py implement
      - name: Static validation
        run: uv run ruff check --select E9,F63,F7,F82 offsetx_apollo_builder/api/app.py tests/test_api_boundary_security.py scripts/s060202_once.py
      - name: Run focused acceptance evidence
        shell: bash
        run: |
          set -o pipefail
          uv run pytest tests/test_api_boundary_security.py -q | tee /tmp/s060202-focused.txt
          echo "FOCUSED_SUMMARY=$(tail -n 1 /tmp/s060202-focused.txt)" >> "$GITHUB_ENV"
      - name: Run existing auth/security regressions
        run: uv run pytest tests/test_api_auth.py tests/test_security_audit.py -q
      - name: Run full Python regression
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q | tee /tmp/s060202-full.txt
          echo "FULL_SUMMARY=$(tail -n 1 /tmp/s060202-full.txt)" >> "$GITHUB_ENV"
      - name: Run frontend regression
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Commit tested implementation
        run: |
          git add offsetx_apollo_builder/api/app.py tests/test_api_boundary_security.py docs/SECURITY.md CHANGELOG.md DEFECT_LOG.md DECISIONS.md TRACEABILITY.md DEMO.md PRODUCT_BACKLOG.md BOARD.md
          git commit -m "Implement S-06.02.02 API boundary hardening"
          git push origin HEAD:feature/s-06-02-02-api-boundaries
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Close governance artifacts
        run: uv run python scripts/s060202_once.py close "$IMPLEMENTATION_SHA" "$FOCUSED_SUMMARY" "$FULL_SUMMARY"
      - name: Independent repository verifier
        run: uv run python scripts/verify_board.py
      - name: Commit certified story state
        run: |
          git add BOARD.md TRACEABILITY.md RETRO.md
          git commit -m "Certify S-06.02.02 delivery artifacts"
          git push origin HEAD:feature/s-06-02-02-api-boundaries
