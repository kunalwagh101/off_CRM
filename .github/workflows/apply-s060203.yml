name: apply-s060203-once

# Retry marker: full suite rerun after an unrelated Chromium startup timeout.
on:
  push:
    branches: [main]
    paths:
      - scripts/apply_s060203.py
      - .github/workflows/apply-s060203.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked Python environment
        run: uv sync --extra dev --extra email --locked
      - name: Apply assertion-backed source transform
        run: uv run python scripts/apply_s060203.py
      - name: Static check changed Python
        run: uv run ruff check --select E9,F63,F7,F82 offsetx_apollo_builder/agent/run.py tests/test_agent_run_budgets.py
      - name: Run budget acceptance evidence
        run: uv run pytest tests/test_agent_run_budgets.py tests/test_agent_money_ceiling.py -q
      - name: Run full Python regression suite
        run: uv run pytest -q
      - name: Remove one-shot transport scaffolding
        run: rm scripts/apply_s060203.py .github/workflows/apply-s060203.yml
      - name: Commit the verified source change
        run: |
          git config user.name "off-CRM delivery bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement S-06.02.03 per-run latency budget"
          git push origin HEAD:main
