name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --extra dev --extra email --locked
      - name: Catch broken Python names and syntax
        run: uv run ruff check --select E9,F63,F7,F82 .
      # Structure only: the suites below already run the tests, so this checks
      # what they cannot — that no "done" in BUILD_STATE.md is unboarded, points
      # at a path that has moved, or claims completion with no test behind it.
      - name: Check BUILD_STATE claims against the repository
        run: uv run python scripts/verify_board.py --no-run
      - name: Smoke-test installed command-line entry points
        run: |
          uv run offsetx-apollo --help
          uv run offsetx-outreach --help
          uv run offsetx-web --help
          uv run offsetx-evals --help
          uv run offsetx-tools --help
          uv run offsetx-notebook --help
          uv run offsetx-db --help
          uv run offsetx-codegraph --help
          uv run offsetx-email-worker --help
      - name: Run Python tests
        run: uv run pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
