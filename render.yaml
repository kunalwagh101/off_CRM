# Two services, one per branch (docs/BRANCHING.md):
#   off-crm-demo     <- main     what people see
#   off-crm-develop  <- develop  where every change lands first
#
# Both are on the free plan, and on the free plan the filesystem does not
# survive a restart, a redeploy or a spin-down after 15 minutes idle:
# everything under /tmp is wiped. With OFFSETX_DATABASE_URL set, keys, AI
# settings, usage counters, logins and the CRM live in that database instead
# (S-06.03.02, S-06.03.03); files - media, renders, exports - and the stores
# not yet moved (S-06.03.06) are still wiped, and nothing backs the database
# up yet (S-06.03.04). That is why
# neither sets OFFSETX_PRODUCTION — the app refuses a production start on /tmp,
# and a demo must never look like the place to keep customers.
#
# Keeping real customer data needs a persistent disk, and Render attaches disks
# only to a paid service. The switch for main is written out in
# docs/BRANCHING.md ("Making main keep its data") and is the owner's call: it
# costs money every month (OPEN_QUESTIONS.md Q-26).
#
# autoDeployTrigger is `commit`, not `checksPass`: GitHub-hosted CI cannot
# start a runner on this repository today (D-75), so "deploy when checks pass"
# would mean "never deploy". Switch it once CI runs.
services:
  - type: web
    name: off-crm-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: OFFSETX_ALLOWED_HOSTS
        sync: false   # the public hostname(s) this service answers to, comma separated
      - key: OFFSETX_WEB_HOST
        value: 0.0.0.0
      - key: OFFSETX_DATA_DIR
        value: /tmp/offsetx/local_data
      - key: OFFSETX_OUTREACH_DB
        value: /tmp/offsetx/local_data/offsetx_outreach.db
      - key: OFFSETX_DEMO_USERNAME
        sync: false
      - key: OFFSETX_DEMO_PASSWORD
        sync: false
      - key: OFFSETX_SESSION_SECRET
        generateValue: true
      - key: OFFSETX_SESSION_HOURS
        value: 8
      # Unsubscribe links in sent mail keep working after a restart (D-203).
      - key: OFFSETX_UNSUBSCRIBE_SECRET
        generateValue: true
      # Provider keys, AI settings, usage counters and logins outlive the wiped
      # disk in a hosted PostgreSQL (docs/architecture/HOSTED_STORAGE.md). Set
      # both or neither, and give each service its own database: develop runs
      # unreviewed code. The key comes from `offsetx-db new-secrets-key`.
      - key: OFFSETX_DATABASE_URL
        sync: false
      - key: OFFSETX_SECRETS_KEY
        sync: false

  - type: web
    name: off-crm-develop
    runtime: docker
    plan: free
    region: singapore
    branch: develop
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: OFFSETX_ALLOWED_HOSTS
        sync: false   # the develop service's own public hostname
      - key: OFFSETX_WEB_HOST
        value: 0.0.0.0
      - key: OFFSETX_DATA_DIR
        value: /tmp/offsetx/local_data
      - key: OFFSETX_OUTREACH_DB
        value: /tmp/offsetx/local_data/offsetx_outreach.db
      - key: OFFSETX_DEMO_USERNAME
        sync: false
      - key: OFFSETX_DEMO_PASSWORD
        sync: false
      - key: OFFSETX_SESSION_SECRET
        generateValue: true
      - key: OFFSETX_SESSION_HOURS
        value: 8
      # Unsubscribe links in sent mail keep working after a restart (D-203).
      - key: OFFSETX_UNSUBSCRIBE_SECRET
        generateValue: true
      # Provider keys, AI settings, usage counters and logins outlive the wiped
      # disk in a hosted PostgreSQL (docs/architecture/HOSTED_STORAGE.md). Set
      # both or neither, and give each service its own database: develop runs
      # unreviewed code. The key comes from `offsetx-db new-secrets-key`.
      - key: OFFSETX_DATABASE_URL
        sync: false
      - key: OFFSETX_SECRETS_KEY
        sync: false
