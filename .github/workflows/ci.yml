name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # The board verifies that recorded commits are ancestors.
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: uv sync --extra dev --extra email --locked
      - name: Catch broken Python names and syntax
        run: uv run --no-sync ruff check --select E9,F63,F7,F82 .
      - name: Smoke-test installed command-line entry points
        run: |
          uv run --no-sync offsetx-apollo --help
          uv run --no-sync offsetx-outreach --help
          uv run --no-sync offsetx-web --help
          uv run --no-sync offsetx-evals --help
          uv run --no-sync offsetx-tools --help
          uv run --no-sync offsetx-notebook --help
          uv run --no-sync offsetx-db --help
          uv run --no-sync offsetx-codegraph --help
          uv run --no-sync offsetx-email-worker --help
      - name: Run Vault acceptance evidence
        run: uv run --no-sync python scripts/run_evidence.py S-03.02.02
      - name: Run Revoke and Forget acceptance evidence
        run: uv run --no-sync python scripts/run_evidence.py S-03.02.03
      - name: Run bounded Run Loop acceptance evidence
        run: uv run --no-sync python scripts/run_evidence.py S-02.02.01
      - name: Run structured Run Result acceptance evidence
        run: uv run --no-sync python scripts/run_evidence.py S-11.02.01
      - name: Run provenance acceptance evidence
        run: uv run --no-sync python scripts/run_evidence.py S-11.02.02
      - name: Run claim verification acceptance evidence
        run: uv run --no-sync python scripts/run_evidence.py S-11.02.03
      - name: Run PLAN.md acceptance evidence
        run: uv run --no-sync pytest tests/test_agent_plan.py -q
      - name: Run page-read cache acceptance evidence
        run: uv run --no-sync python scripts/run_evidence.py S-11.02.04
      - name: Run evidence-runner acceptance tests
        run: uv run --no-sync pytest tests/test_evidence_runner.py -q
      - name: Run Python tests
        run: uv run --no-sync pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # The board verifier and evidence runner are standard-library-only. The
      # locked sync above and npm ci are the entire setup; --no-sync proves the
      # verifier cannot hide a second dependency-install step.
      - name: Verify the board against the repository
        run: uv run --no-sync python scripts/verify_board.py
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
