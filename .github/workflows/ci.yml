name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked environment for this interpreter
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra email --extra postgres --locked
      - name: Run the complete Python regression suite
        run: uv run pytest -q

  quality:
    runs-on: ubuntu-latest
    # Full regressions plus the 70 historical evidence commands exceed 15 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # S-06.02.12 verifies that every evidence commit is an ancestor of
          # HEAD. A depth-1 checkout makes truthful historical commits look
          # nonexistent, so the verifier needs the branch history it verifies.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The extras the Docker image ships with (`Dockerfile`): tests of the
      # PostgreSQL driver's behaviour failed here without it (D-241).
      - name: Install Python dependencies
        run: uv sync --extra dev --extra email --extra postgres --locked
      # DONE evidence is allowed to name frontend tests. Install those
      # dependencies before the verifier re-runs evidence, not afterwards.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # Package metadata comes from the live registry. A passing npm install
      # does not establish that the dependency graph is safe.
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=low
      - name: Audit frontend development dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Catch broken Python names and syntax
        run: uv run ruff check --select E9,F63,F7,F82 .
      - name: Smoke-test installed command-line entry points
        run: |
          uv run offsetx-apollo --help
          uv run offsetx-outreach --help
          uv run offsetx-web --help
          uv run offsetx-evals --help
          uv run offsetx-tools --help
          uv run offsetx-notebook --help
          uv run offsetx-db --help
          uv run offsetx-codegraph --help
          uv run offsetx-artifacts --help
          uv run offsetx-email-worker --help
      - name: Run Vault acceptance evidence
        run: uv run pytest tests/test_browser_vault.py tests/test_browser_vault_wiring.py -q
      - name: Run Revoke and Forget acceptance evidence
        run: uv run pytest tests/test_browser_revoke.py -q
      - name: Run bounded Run Loop acceptance evidence
        run: uv run pytest tests/test_agent_run.py -q
      - name: Run structured Run Result acceptance evidence
        run: uv run pytest tests/test_agent_structured_result.py -q
      - name: Run provenance acceptance evidence
        run: uv run pytest tests/test_agent_provenance.py -q
      - name: Run claim verification acceptance evidence
        run: uv run pytest tests/test_agent_claim_verification.py -q
      # The suite job runs all Python regressions on every supported version.
      # The board verifier is standard-library-only, but the evidence commands
      # it re-runs are not: they invoke `python -m pytest` and, for shipped UI
      # slices, `npm test`. Run it only after both locked environments exist.
      - name: Verify the board against the repository
        run: uv run python scripts/verify_board.py
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # S-06.03.03's acceptance: the CRM's tests pass against SQLite and PostgreSQL
  # alike. Without this job every PostgreSQL case was skipped in CI, so a break
  # on that side merged green (review finding 5). Two runs: the storage tests
  # with a real database, then the whole suite with every CRM swapped onto it
  # (`tests/conftest.py`). The `postgres` extra installs the driver, which a
  # plain sync leaves out.
  postgres:
    # Ubuntu 24.04 provides PostgreSQL client 16 in its supported repositories.
    # ubuntu-latest moved to 26.04, whose default client cannot restore to 16.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OFF_CRM_TEST_POSTGRES_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      OFF_CRM_TEST_PGBOUNCER_URL: postgresql://postgres:ci-only-password@127.0.0.1:6543/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # The board's recorded commits require complete ancestry in every
          # job that can execute repository verification.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies, PostgreSQL driver included
        run: uv sync --extra dev --extra email --extra postgres --locked
      # The runner's default client can be newer than this job's server.
      # Newer dump headers (for example transaction_timeout) cannot restore to 16.
      - name: Select PostgreSQL 16 backup and recovery clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16 pgbouncer
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/pg_restore --version
      - name: Start isolated transaction-pooler acceptance target
        run: uv run python scripts/ci/start_test_pgbouncer.py
      - name: Prove PostgreSQL namespace isolation with direct and pooled connections
        run: uv run pytest -q tests/test_postgres_namespaces.py
      - name: Storage tests against PostgreSQL
        run: >-
          uv run pytest -q tests/test_crm_hosted.py tests/test_hosted_storage.py
          tests/test_db_backend.py tests/test_storage_inventory.py
          tests/test_video_postgres.py tests/test_crm_harness.py
      - name: Whole suite with every CRM on PostgreSQL
        env:
          OFF_CRM_TEST_CRM_ON_POSTGRES: "1"
        run: uv run pytest -q
